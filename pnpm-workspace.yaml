# pnpm 11 workspace/settings file — build-script approval for deps that need
# a postinstall step (esbuild platform binary check via tsup; msgpackr-extract
# optional native accelerator used by vitest; duckdb native binding).
onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract
  - duckdb
allowBuilds:
  duckdb: true
  esbuild: true
  msgpackr-extract: true
# Security overrides for transitive dependencies flagged by OSV-Scanner.
overrides:
  "esbuild@<0.28.1": "^0.28.1"
  "tar@<7": "^7.5.22"
  "http-cache-semantics@<4.3.0": "^4.3.0"
